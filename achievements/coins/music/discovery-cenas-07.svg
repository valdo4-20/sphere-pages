@keyframes medal-gem-sheen{0%,100%{opacity:.35;transform:rotate(-22deg)}50%{opacity:.8;transform:rotate(22deg)}}
@media(prefers-reduced-motion:reduce){.medal-gem-glint,.medal-gem-sheen{animation:none}}
