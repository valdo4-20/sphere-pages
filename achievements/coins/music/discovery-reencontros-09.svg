/* Satin surfaces keep the engraving visible without a luminous halo. */
.achievement-medal-artwork.is-unlocked { filter:none; }
.achievement-medal-artwork[data-rarity='diamond'].is-unlocked { --medal-highlight:#c3d5dc;--medal-light:#a3c1cc;--medal-base:#7398a3;--medal-dark:#314b59;--medal-edge-light:#bdcfd5;--medal-enamel-light:#91acb7;--medal-enamel:#648795;--medal-enamel-dark:#344e5b;--medal-core:#3d626f;--medal-icon:#e2edf0;filter:none; }
.achievement-medal-artwork[data-rarity='obsidian'].is-unlocked { --medal-highlight:#a4a0b0;--medal-light:#777381;--medal-base:#303039;--medal-dark:#14141b;--medal-edge-light:#8d8999;--medal-enamel-light:#55505e;--medal-enamel:#292731;--medal-enamel-dark:#17151e;--medal-core:#24212b;--medal-icon:#d8d1e3;filter:none; }

/* Gemstones catch light on their cut; ordinary metals remain satin. */
.achievement-medal-artwork[data-rarity='diamond'].is-unlocked {
  --medal-highlight:#ffffff;--medal-light:#d5f6ff;--medal-base:#8cc5dc;
  --medal-dark:#31516e;--medal-edge-light:#ffffff;
