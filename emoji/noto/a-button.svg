@media(prefers-reduced-motion:reduce){.a-stroke,.a-letter{animation:none;opacity:1;stroke-dashoffset:0}}
</style><g class="a-letter"><path class="a-stroke a-sides" pathLength="1" d="M40 92 64 39 88 92"/><path class="a-stroke a-cross" pathLength="1" d="M49 74h30"/></g></svg>